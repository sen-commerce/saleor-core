# ══════════════════════════════════════════════════════════════════
# Backend CI/CD — Build, Push to GHCR, Deploy to Cloud Run, Migrate
# ══════════════════════════════════════════════════════════════════
# 触发: Push tag v* 或手动 workflow_dispatch
# 认证: Workload Identity Federation (OIDC) — 无密钥

name: Build, Push & Deploy

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GCP_REGION: us-central1
  API_SERVICE: saleor-api
  WORKER_SERVICE: saleor-worker

jobs:
  # ──────────────────────────────────────
  # Job 1: Build & Push Docker Image to GHCR
  # ──────────────────────────────────────
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_url: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────
  # Job 2: Deploy to Cloud Run
  # ──────────────────────────────────────
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE }}
          image: ${{ needs.build-push.outputs.image_url }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --port=8000
            --min-instances=1
            --max-instances=10
            --memory=1Gi
            --cpu=1
            --timeout=300
            --allow-unauthenticated
          env_vars: |
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=api.tiptoppick.com
            ALLOWED_CLIENT_HOSTS=tiptoppick.com,dashboard.tiptoppick.com
            PUBLIC_URL=https://api.tiptoppick.com
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CACHE_URL=${{ secrets.CACHE_URL }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            EMAIL_URL=${{ secrets.EMAIL_URL }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            DASHBOARD_URL=https://dashboard.tiptoppick.com/
            DEFAULT_CHANNEL_SLUG=default-channel
            HTTP_IP_FILTER_ALLOW_LOOPBACK_IPS=False
            PLAYGROUND_ENABLED=False
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_MEDIA_BUCKET_NAME=${{ secrets.AWS_MEDIA_BUCKET_NAME }}
            AWS_S3_ENDPOINT_URL=${{ secrets.AWS_S3_ENDPOINT_URL }}
            AWS_S3_REGION_NAME=auto
            AWS_MEDIA_CUSTOM_DOMAIN=${{ secrets.AWS_MEDIA_CUSTOM_DOMAIN }}

      - name: Deploy Worker to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WORKER_SERVICE }}
          image: ${{ needs.build-push.outputs.image_url }}
          region: ${{ env.GCP_REGION }}
          flags: >-
            --command=celery,-A,saleor,--app=saleor.celeryconf:app,worker,--loglevel=info,-B
            --min-instances=1
            --max-instances=3
            --memory=1Gi
            --cpu=1
            --no-allow-unauthenticated
          env_vars: |
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            CACHE_URL=${{ secrets.CACHE_URL }}
            CELERY_BROKER_URL=${{ secrets.CELERY_BROKER_URL }}
            EMAIL_URL=${{ secrets.EMAIL_URL }}
            DEFAULT_FROM_EMAIL=${{ secrets.DEFAULT_FROM_EMAIL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}

  # ──────────────────────────────────────
  # Job 3: Database Migration (Cloud Run Jobs)
  # ──────────────────────────────────────
  migrate:
    needs: [build-push, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Database Migration
        run: |
          # Update or create the migration job
          gcloud run jobs update saleor-migrate \
            --image=${{ needs.build-push.outputs.image_url }} \
            --region=${{ env.GCP_REGION }} \
            --command="python" \
            --args="manage.py,migrate,--noinput" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }},DEBUG=False" \
            --max-retries=1 \
            --task-timeout=600 \
            --memory=1Gi \
            --cpu=1 \
            2>/dev/null || \
          gcloud run jobs create saleor-migrate \
            --image=${{ needs.build-push.outputs.image_url }} \
            --region=${{ env.GCP_REGION }} \
            --command="python" \
            --args="manage.py,migrate,--noinput" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }},SECRET_KEY=${{ secrets.SECRET_KEY }},DEBUG=False" \
            --max-retries=1 \
            --task-timeout=600 \
            --memory=1Gi \
            --cpu=1

          # Execute the migration job
          gcloud run jobs execute saleor-migrate \
            --region=${{ env.GCP_REGION }} \
            --wait

          echo "✅ Database migration completed successfully"
